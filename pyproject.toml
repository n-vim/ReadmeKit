[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "readmekit"
version = "0.1.0"
description = "A Python CLI that generates clean README, CONTRIBUTING, SECURITY, and GitHub documentation for repositories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Nitish Vimal" }
]
keywords = [
  "readme",
  "documentation",
  "markdown",
  "github",
  "cli",
  "developer-tools"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Utilities"
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
readmekit = "readmekit.cli:app"
readme-kit = "readmekit.cli:app"

[project.urls]
Homepage = "https://github.com/n-vim/ReadmeKit"
Repository = "https://github.com/n-vim/ReadmeKit"
Issues = "https://github.com/n-vim/ReadmeKit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/readmekit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true
mypy_path = "src"
